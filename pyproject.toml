[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-forward-manager"
version = "0.1.3"
description = "Named SSH forwards with systemd supervision and optional Noctalia controls"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
portforward = "portforward_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["portforward/backend"]

[tool.pytest.ini_options]
pythonpath = ["portforward/backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["portforward_manager"]

[tool.pyright]
include = ["portforward/backend", "install.py"]
extraPaths = ["portforward/backend"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
