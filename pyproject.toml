[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-forward-manager"
version = "0.1.0"
description = "Named SSH forwards with systemd supervision and optional Noctalia controls"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
portforward = "portforward_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "install.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
