repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Python lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Python format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pyright
        name: Python types
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: plugin-lint
        name: Noctalia plugin
        entry: noctalia plugins lint portforward
        language: system
        pass_filenames: false
      - id: lifecycle-tests
        name: Forwarding lifecycle tests
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
